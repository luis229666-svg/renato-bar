<title>Renato Bar Mondello</title>

<style>
:root{
  --cream:#F6ECDD; --cream-soft:rgba(246,236,221,.72); --cream-faint:rgba(246,236,221,.45);
  --gold:#E8B86D; --espresso:#1c0f06;
  --glass:linear-gradient(155deg, rgba(255,247,235,.16), rgba(255,247,235,.04));
  --line:rgba(255,236,210,.22);
  --pad:max(14px, env(safe-area-inset-left));
  --header-h:210px;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  /* ---- colori tema (sovrascritti per ogni cliente) ---- */
  --bg-1:#3a1d0c; --bg-2:#2a1408; --bg-3:#1c0d05;
  --bg-glow:#7a4521; --bg-mid:#5a2f14;
  --silk-1:rgba(214,150,90,.55); --silk-2:rgba(180,110,60,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--cream); min-height:100vh; line-height:1.42; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
/* ----- ambient melted-chocolate background ----- */
.bg{position:fixed; inset:0; z-index:-2;
  background:
   radial-gradient(120% 80% at 80% -10%, var(--bg-glow) 0%, transparent 55%),
   radial-gradient(120% 90% at 0% 30%, var(--bg-mid) 0%, transparent 50%),
   linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
}
.silk{position:fixed; z-index:-1; inset:-10% -10%; pointer-events:none; opacity:.6;
  background:
   radial-gradient(40% 18% at 30% 35%, var(--silk-1), transparent 60%),
   radial-gradient(46% 16% at 75% 65%, var(--silk-2), transparent 60%);
  filter:blur(30px); animation:flow 26s ease-in-out infinite;}
@keyframes flow{0%,100%{transform:translateY(0)}50%{transform:translateY(3vh)}}

.glass{position:relative; background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(155%); backdrop-filter:blur(22px) saturate(155%);
  border:1px solid var(--line); border-radius:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.32), inset 0 -10px 24px rgba(0,0,0,.10);}
.glass::before{content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:linear-gradient(135deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 40%);
  mix-blend-mode:screen; opacity:.65;}

/* ----- sticky control panel ----- */
.controls{position:sticky; top:0; z-index:30; padding:10px var(--pad) 8px;
  margin:0 0 4px; border-radius:0 0 26px 26px;}
.brandrow{display:flex; align-items:center; gap:10px; padding:2px 4px 8px;}
.logo{line-height:.86;}
.logo .w{font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--cream-soft); display:block;}
.logo .c{font-size:23px; font-weight:800; letter-spacing:.5px; color:var(--cream);}
.brandrow .tag{margin-left:auto; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--cream-faint);}

/* language tabs */
.langtabs{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none;}
.langtabs::-webkit-scrollbar{display:none;}
.langtab{flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:7px 11px; border-radius:13px;
  font-size:13px; font-weight:600; cursor:pointer; user-select:none; white-space:nowrap;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); color:var(--cream-soft);
  transition:transform .12s ease, background .15s ease;}
.langtab .fl{font-size:15px;}
.langtab.active{background:var(--gold); border-color:var(--gold); color:var(--espresso);}
.langtab:active{transform:scale(.95);}

/* search */
.searchwrap{display:flex; align-items:center; gap:9px; padding:9px 13px; border-radius:15px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); margin:0 2px 8px;}
.searchwrap svg{flex:0 0 auto; opacity:.7;}
.searchwrap input{flex:1; min-width:0; background:transparent; border:0; outline:0;
  color:var(--cream); font:inherit; font-size:15px;}
.searchwrap input::placeholder{color:var(--cream-faint);}
.searchwrap .clear{cursor:pointer; color:var(--cream-faint); font-size:18px; padding:0 2px; display:none;}

/* section chips (rettangolini) */
.chips{display:flex; gap:7px; overflow-x:auto; padding:1px 2px 2px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:12px;
  font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; color:var(--cream-soft);
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); transition:background .15s, color .15s;}
.chip .ce{font-size:14px;}
.chip.active{background:rgba(232,184,109,.22); border-color:var(--gold); color:var(--cream);}

main{padding:6px var(--pad) 0; max-width:580px; margin:0 auto;}

.sec-head{display:flex; align-items:center; gap:10px; margin:24px 6px 10px; scroll-margin-top:var(--header-h);}
.sec-head .ico{font-size:21px;}
.sec-head h2{margin:0; font-family:var(--font-display); font-weight:600; font-size:23px; letter-spacing:2px; text-transform:uppercase;}
.sec-head .rule{flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent);}

.card{padding:13px 15px; margin:9px 0;}
.item-top{display:flex; align-items:flex-start; gap:12px;}
.item-ico{flex:0 0 auto; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-size:20px;
  background:linear-gradient(155deg, rgba(255,255,255,.18), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.20); box-shadow:inset 0 1px 0 rgba(255,255,255,.4); transform:translateY(1px);}
.item-body{flex:1; min-width:0;}
.item-name{font-family:var(--font-display); font-weight:600; font-size:18.5px; letter-spacing:.2px; display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
.item-name .nm{min-width:0;}
.item-name .price{font-family:var(--font-body); font-weight:800; font-size:13.5px; color:var(--gold); white-space:nowrap;}
.item-desc{font-size:12.5px; color:var(--cream-soft); margin-top:2px;}
.pills{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; align-items:center;}
.pills .lbl{font-size:10px; letter-spacing:.4px; text-transform:uppercase; color:var(--cream-faint); margin-right:1px;}
.pill{display:inline-flex; align-items:center; gap:4px; padding:3px 8px 3px 5px; border-radius:999px; font-size:11.5px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16);}
.pill .num{display:grid; place-items:center; width:15px; height:15px; border-radius:50%; font-size:9px; font-weight:800; color:var(--espresso); background:var(--gold);}
.pill.none{color:var(--cream-faint); background:transparent; border-style:dashed;}
.sec-note{font-size:11.5px; color:var(--cream-soft); margin:2px 8px 4px; padding:9px 12px; border-radius:14px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);}
.sec-note b{color:var(--gold); font-weight:700; letter-spacing:.4px; text-transform:uppercase; font-size:10.5px;}
.flavbox{margin:2px 6px 8px; padding:13px 14px; border-radius:18px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);}
.flavlabel{font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:10px;}
.flavwrap{display:flex; flex-wrap:wrap; gap:8px;}
.flavtag{font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1; padding:8px 14px; border-radius:13px; color:var(--cream);
  background:linear-gradient(155deg, rgba(255,255,255,.18), rgba(255,255,255,.04)); border:1px solid rgba(255,236,210,.24);}

.legend-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:6px;}
.all-chip{display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:14px;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13);}
.all-chip .n{flex:0 0 auto; display:grid; place-items:center; width:21px; height:21px; border-radius:50%; font-size:10.5px; font-weight:800; color:var(--espresso); background:var(--gold);}
.all-chip .e{font-size:16px;}
.all-chip .nm{font-size:12px; line-height:1.15;}

.nores{text-align:center; color:var(--cream-soft); padding:40px 10px; font-size:14px; display:none;}
footer{text-align:center; color:var(--cream-faint); font-size:11px; margin:26px var(--pad) 0; letter-spacing:.3px; line-height:1.7;}

.reveal{opacity:0; transform:translateY(8px); animation:rise .45s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes rise{to{opacity:1; transform:none;}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none;}.silk{animation:none;}}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:8px;}

/* ---- rifiniture grafiche ---- */
.item-ico svg,.sec-head svg{display:block}
.item-ico{overflow:hidden; transition:transform .18s ease, box-shadow .18s ease;}
.card{transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease;}
@media (hover:hover){ .card:hover{transform:translateY(-2px); box-shadow:0 16px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.34);} }
.item-name .price{font-variant-numeric:tabular-nums; letter-spacing:.2px;}
.sec-head .ico{filter:drop-shadow(0 1px 1px rgba(0,0,0,.22));}

/* ---- tema del cliente (generato dal build) ---- */
:root{
  --cream:#EAF3FA; --cream-soft:rgba(234,243,250,0.72); --cream-faint:rgba(234,243,250,0.45);
  --gold:#5FB3E6; --espresso:#06161f;
  --line:rgba(234,243,250,0.22);
  --bg-1:#103a55; --bg-2:#0c2b40; --bg-3:#061520;
  --bg-glow:#2079a8; --bg-mid:#134e6f;
  --silk-1:rgba(32,121,168,0.55); --silk-2:rgba(19,78,111,0.5);
}
</style>
</head>

<div class="bg"></div><div class="silk"></div>

<div class="controls glass">
  <div class="brandrow">
    <div class="logo"><span class="w">Renato</span><span class="c">Bar Mondello</span></div>
    <div class="tag" id="tag">Menù al tavolo</div>
  </div>
  <div class="langtabs" id="langtabs"></div>
  <div class="searchwrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input id="search" type="search" autocomplete="off" inputmode="search" placeholder="">
    <span class="clear" id="clear">&times;</span>
  </div>
  <div class="chips" id="chips"></div>
</div>

<main>
  <div id="root"></div>
  <div class="nores" id="nores"></div>
  <footer id="footer"></footer>
</main>

/* resolve icon: key in ICONS -> SVG; otherwise emoji/inline string as-is */
function icon(v){ return (v && ICONS[v]) ? ICONS[v] : (v||''); }

const $=s=>document.querySelector(s);
const FLAGS={it:"🇮🇹",en:"🇬🇧",fr:"🇫🇷",es:"🇪🇸",de:"🇩🇪",ru:"🇷🇺",zh:"🇨🇳"};
const CODES={it:"IT",en:"EN",fr:"FR",es:"ES",de:"DE",ru:"RU",zh:"中文"};
let lang="it";
const A=DATA.allergens, UI=DATA.ui;

function t(obj){ if(obj==null) return ""; if(typeof obj==="string") return obj; return obj[lang]||obj.it||""; }

/* ---- build language tabs + section chips once ---- */
function buildControls(){
  $("#langtabs").innerHTML = DATA.langs.map(l=>
    `<div class="langtab" data-l="${l}"><span class="fl">${FLAGS[l]}</span>${CODES[l]}</div>`).join("");
  $("#langtabs").querySelectorAll(".langtab").forEach(el=>{
    el.addEventListener("click",()=>{ lang=el.dataset.l; setLang(); });
  });
  const chips = DATA.menu.map(s=>`<div class="chip" data-id="${s.id}"><span class="ce">${icon(s.icon)}</span><span class="cl">${t(s.cat)}</span></div>`).join("")
    + `<div class="chip" data-id="allergeni"><span class="ce">⚠️</span><span class="cl">${t(UI.allergens)}</span></div>`;
  $("#chips").innerHTML = chips;
  $("#chips").querySelectorAll(".chip").forEach(el=>{
    el.addEventListener("click",()=>{
      const target=document.getElementById("sec-"+el.dataset.id);
      if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}

function pill(key){const a=A[key]; return `<span class="pill"><span class="num">${a.n}</span>${a.e} ${t(a.nm)}</span>`;}

/* ---- render menu + legend ---- */
function render(){
  let html="", i=0;
  for(const s of DATA.menu){
    html+=`<div class="sec-head" id="sec-${s.id}"><span class="ico">${icon(s.icon)}</span><h2>${t(s.cat)}</h2><span class="rule"></span></div>`;
    if(s.note){
      if(s.note.flavours){
        html+=`<div class="flavbox"><div class="flavlabel">${t(s.note.label)}</div><div class="flavwrap">`
          +s.note.flavours.map(f=>`<span class="flavtag">${f}</span>`).join("")+`</div></div>`;
      } else {
        html+=`<div class="sec-note"><b>${t(s.note.label)}</b><br>${t(s.note.text)}</div>`;
      }
    }
    for(const it of s.items){
      const dsc=t(it.desc);
      const pills = (it.all&&it.all.length)
        ? `<span class="lbl">${t(UI.contains)}</span>`+it.all.map(pill).join("")
        : `<span class="pill none">${t(UI.none)}</span>`;
      const search=(it.name+" "+dsc+" "+t(s.cat)).toLowerCase();
      html+=`<div class="glass card reveal item" data-s="${search}" style="animation-delay:${Math.min(i*22,300)}ms">
        <div class="item-top"><div class="item-ico">${icon(it.icon||s.icon)}</div>
          <div class="item-body">
            <div class="item-name"><span class="nm">${it.name}</span><span class="price">${it.price}</span></div>
            ${dsc?`<div class="item-desc">${dsc}</div>`:""}
            <div class="pills">${pills}</div>
          </div></div></div>`;
      i++;
    }
  }
  // legend
  html+=`<div class="sec-head" id="sec-allergeni"><span class="ico">⚠️</span><h2>${t(UI.allergens)}</h2><span class="rule"></span></div>`;
  html+=`<div class="sec-note">${t(UI.note)}</div>`;
  html+=`<div class="glass card" style="padding:8px"><div class="legend-grid">`+
    Object.values(A).map(a=>`<div class="all-chip"><span class="n">${a.n}</span><span class="e">${a.e}</span><span class="nm">${t(a.nm)}</span></div>`).join("")+
    `</div></div>`;
  $("#root").innerHTML=html;
}

function setLang(){
  document.documentElement.lang=lang;
  $("#tag").textContent=t(UI.tag);
  $("#search").placeholder=t(UI.search);
  $("#nores").textContent=t(UI.noresults);
  $("#footer").innerHTML=t(UI.avail)+"<br>"+t(UI.frozen);
  $("#langtabs").querySelectorAll(".langtab").forEach(el=>el.classList.toggle("active", el.dataset.l===lang));
  $("#chips").querySelectorAll(".chip").forEach(el=>{
    const s=DATA.menu.find(x=>x.id===el.dataset.id);
    el.querySelector(".cl").textContent = s?t(s.cat):t(UI.allergens);
  });
  render();
  applyFilter();
  observe();
}

/* ---- search ---- */
function applyFilter(){
  const q=$("#search").value.trim().toLowerCase();
  $("#clear").style.display=q?"block":"none";
  let any=false;
  document.querySelectorAll(".item").forEach(el=>{
    const ok=!q || el.dataset.s.includes(q);
    el.style.display=ok?"":"none"; if(ok) any=true;
  });
  // hide empty section headings while searching
  document.querySelectorAll(".sec-head").forEach(h=>{
    if(h.id==="sec-allergeni"){ h.style.display=q?"none":""; return; }
    let n=h.nextElementSibling, vis=false;
    while(n && !n.classList.contains("sec-head")){
      if(n.classList.contains("item") && n.style.display!=="none") vis=true;
      if(n.classList.contains("sec-note")) n.style.display=q?"none":"";
      n=n.nextElementSibling;
    }
    h.style.display=(q && !vis)?"none":"";
  });
  // legend block hidden during search
  const legend=document.querySelector(".legend-grid"); if(legend) legend.closest(".card").style.display=q?"none":"";
  const note=document.querySelector("#sec-allergeni"); // its note is next .sec-note after it
  $("#nores").style.display=(q && !any)?"block":"none";
}
$("#search").addEventListener("input",applyFilter);
$("#clear").addEventListener("click",()=>{$("#search").value="";applyFilter();$("#search").focus();});

/* ---- scrollspy for chips ---- */
let io=null;
function observe(){
  if(io) io.disconnect();
  const h=$(".controls").offsetHeight;
  document.documentElement.style.setProperty("--header-h",(h+14)+"px");
  io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id=e.target.id.replace("sec-","");
        $("#chips").querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.id===id));
        const ac=$("#chips").querySelector(".chip.active");
        if(ac) ac.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
      }
    });
  },{rootMargin:`-${h+20}px 0px -70% 0px`, threshold:0});
  document.querySelectorAll(".sec-head").forEach(s=>io.observe(s));
}

buildControls();
setLang();
window.addEventListener("resize",()=>observe());
</script>
